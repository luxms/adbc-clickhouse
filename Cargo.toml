[package]
name = "adbc-clickhouse"
version = "0.1.0"
edition = "2024"

[dependencies]
adbc_core = "0.24.0"
adbc_ffi = { version = "0.24.0", optional = true }

arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
serde_arrow = { version = "0.14.2", features = ["arrow-59"] }

clickhouse-arrow = { git = "https://github.com/luxms/clickhouse-arrow", rev = "63aa3a3d4ba0f6a2aeb46bba805f8d9a9906c687", features = ["derive"] }

futures = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
itertools = "0.14.0"

[build-dependencies]
cargo_metadata = "0.23.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
crate-type = ["lib", "cdylib"]

[features]
ffi = ["dep:adbc_ffi"]
